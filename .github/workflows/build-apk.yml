name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app-launcher@6 @capacitor/filesystem@6 @capacitor/share@6 xlsx@0.18.5
          mkdir -p www
          cp index.html www/index.html
          cp node_modules/xlsx/dist/xlsx.full.min.js www/
          npx cap init "WA Tagihan Listrik" com.aldi.watagihan --web-dir www || true
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: WA-Tagihan-Listrik-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
